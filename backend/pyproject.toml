[project]
name = "pixel-t-backend"
version = "1.0.0"
description = "PIXEL-T medical image analysis backend"
requires-python = ">=3.10"

dependencies = [
    "Flask>=3.0.0,<4.0.0",
    "Flask-Cors>=4.0.0,<6.0.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.10.0,<3.0.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "segmentation-models-pytorch>=0.5.0,<0.6.0",
    "numpy>=1.26.0,<2.2.0",
    "scipy>=1.13.0,<2.0.0",
    "opencv-python-headless>=4.10.0,<5.0.0",
    "Pillow>=10.2.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "google-genai>=3.0.0,<3.1.0",
]

[project.optional-dependencies]
production = [
    "gunicorn>=21.2.0,<23.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]
